<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="description" content="DRIP CHECK — L'IA qui juge ta tenue. No cap." />
  <meta property="og:title" content="DRIP CHECK ⚡" />
  <meta property="og:description" content="Poste ta tenue. L'IA te juge. Tu ris. Tu partages." />
  <meta name="theme-color" content="#080808" />
  <title>DRIP CHECK ⚡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--black:#080808;--white:#f5f0e8;--yellow:#FFE234;--pink:#FF3CAC;--green:#00FF87;--red:#FF2D2D;--purple:#B44FFF}
    body{background:var(--black);display:flex;justify-content:center}
    .app{background:var(--black);min-height:100vh;font-family:'DM Sans',sans-serif;color:var(--white);display:flex;flex-direction:column;align-items:center;padding:0 0 80px;width:100%;max-width:430px}
    .header{width:100%;padding:28px 20px 0;display:flex;flex-direction:column;align-items:center}
    .logo-wrap{position:relative}
    .logo{font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:8px;line-height:1;background:linear-gradient(135deg,var(--yellow) 0%,var(--pink) 60%,var(--purple) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 40px rgba(255,226,52,.25))}
    .logo-beta{position:absolute;top:6px;right:-36px;background:var(--pink);color:#fff;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:1px}
    .tagline{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;color:rgba(245,240,232,.35);text-transform:uppercase;margin-top:6px}
    .lang-row{display:flex;gap:6px;margin-top:14px}
    .lang-btn{padding:4px 12px;border-radius:100px;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(245,240,232,.45);font-family:'Space Mono',monospace;font-size:10px;cursor:pointer;transition:all .2s;letter-spacing:1px}
    .lang-btn.active{background:rgba(255,255,255,.08);color:var(--white);border-color:rgba(255,255,255,.25)}
    .upload-zone{margin:24px 20px 0;width:calc(100% - 40px);border:2px dashed rgba(255,226,52,.25);border-radius:24px;padding:32px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:all .3s;background:rgba(255,226,52,.02)}
    .upload-zone:hover{border-color:var(--yellow);background:rgba(255,226,52,.05)}
    .upload-icon{font-size:44px;animation:bounce 2s ease-in-out infinite}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .upload-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--yellow)}
    .upload-sub{font-size:12px;color:rgba(245,240,232,.35);text-align:center;line-height:1.6}
    .upload-btn{margin-top:6px;background:var(--yellow);color:var(--black);border:none;padding:11px 26px;border-radius:100px;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:transform .2s,box-shadow .2s}
    .upload-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,226,52,.35)}
    .preview-wrap{margin:24px 20px 0;width:calc(100% - 40px);position:relative}
    .preview-img{width:100%;border-radius:20px;display:block;max-height:380px;object-fit:cover}
    .preview-change{position:absolute;top:12px;right:12px;background:rgba(8,8,8,.75);border:1px solid rgba(245,240,232,.18);color:var(--white);padding:6px 14px;border-radius:100px;font-size:11px;font-family:'Space Mono',monospace;cursor:pointer}
    .section{margin:20px 20px 0;width:calc(100% - 40px)}
    .section-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:3px;color:rgba(245,240,232,.35);text-transform:uppercase;margin-bottom:10px}
    .pills{display:flex;flex-wrap:wrap;gap:8px}
    .pill{padding:7px 15px;border-radius:100px;border:1px solid rgba(245,240,232,.12);font-size:13px;cursor:pointer;transition:all .2s;background:transparent;color:rgba(245,240,232,.7)}
    .pill.active{background:var(--yellow);color:var(--black);border-color:var(--yellow);font-weight:600}
    .style-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .style-card{padding:10px 8px;border-radius:14px;border:1px solid rgba(245,240,232,.1);background:rgba(255,255,255,.03);text-align:center;cursor:pointer;transition:all .2s}
    .style-card.active{border-color:var(--yellow);background:rgba(255,226,52,.08)}
    .style-icon{font-size:22px;display:block;margin-bottom:4px}
    .style-name{font-size:11px;color:rgba(245,240,232,.7);font-weight:500}
    .style-card.active .style-name{color:var(--yellow)}
    .analyze-btn{margin:24px 20px 0;width:calc(100% - 40px);background:linear-gradient(135deg,var(--yellow),var(--pink));border:none;border-radius:18px;padding:18px;font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:4px;color:var(--black);cursor:pointer;transition:transform .2s,box-shadow .2s}
    .analyze-btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 14px 40px rgba(255,60,172,.45)}
    .analyze-btn:disabled{opacity:.35;cursor:not-allowed}
    .loading-wrap{margin:40px 20px 0;width:calc(100% - 40px);display:flex;flex-direction:column;align-items:center;gap:14px}
    .loading-emoji{font-size:40px;animation:spin 1.5s linear infinite}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    .loading-text{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--yellow)}
    .loading-bar{width:100%;height:3px;background:rgba(255,226,52,.12);border-radius:10px;overflow:hidden}
    .loading-progress{height:100%;background:linear-gradient(90deg,var(--yellow),var(--pink),var(--purple));border-radius:10px;animation:loadBar 2.5s ease-in-out infinite}
    @keyframes loadBar{0%{width:0}70%{width:85%}100%{width:95%}}
    .result-card{margin:24px 20px 0;width:calc(100% - 40px);background:#111;border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.07);animation:slideUp .5s cubic-bezier(.34,1.56,.64,1)}
    @keyframes slideUp{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
    .result-top{padding:20px 20px 0;display:flex;justify-content:space-between;align-items:flex-start}
    .score-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:3px;color:rgba(245,240,232,.3);text-transform:uppercase;margin-bottom:2px}
    .score-num{font-family:'Bebas Neue',sans-serif;font-size:88px;line-height:1}
    .score-fire{color:var(--green);text-shadow:0 0 50px rgba(0,255,135,.5)}
    .score-good{color:var(--yellow);text-shadow:0 0 40px rgba(255,226,52,.45)}
    .score-mid{color:var(--pink);text-shadow:0 0 40px rgba(255,60,172,.4)}
    .score-low{color:var(--red);text-shadow:0 0 40px rgba(255,45,45,.4)}
    .vibe-side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
    .vibe-emoji{font-size:46px}
    .vibe-tag{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;color:rgba(245,240,232,.4);max-width:130px;line-height:1.5;text-align:right}
    .divider{margin:14px 20px;height:1px;background:rgba(255,255,255,.06)}
    .verdict{padding:0 20px;font-size:14.5px;line-height:1.75;color:rgba(245,240,232,.9)}
    .verdict strong{color:var(--yellow)}
    .comparison{margin:14px 20px;background:rgba(255,226,52,.05);border:1px solid rgba(255,226,52,.12);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start}
    .comp-icon{font-size:34px;flex-shrink:0}
    .comp-name{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;color:var(--yellow);display:block;margin-bottom:3px}
    .comp-text{font-size:12.5px;line-height:1.6;color:rgba(245,240,232,.6)}
    .refs-row{padding:0 20px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
    .ref-tag{padding:4px 10px;border-radius:100px;background:rgba(180,79,255,.12);border:1px solid rgba(180,79,255,.2);font-family:'Space Mono',monospace;font-size:10px;color:var(--purple);letter-spacing:.5px}
    .challenge{margin:10px 20px 20px;background:rgba(255,60,172,.06);border:1px solid rgba(255,60,172,.18);border-radius:14px;padding:13px;font-size:13px;line-height:1.65;color:rgba(245,240,232,.75);display:flex;gap:10px;align-items:flex-start}
    .challenge-icon{font-size:18px;flex-shrink:0;margin-top:1px}
    .share-row{margin:16px 20px 0;width:calc(100% - 40px);display:flex;gap:10px}
    .share-btn{flex:1;padding:13px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:transparent;color:rgba(245,240,232,.7);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
    .share-btn:hover{background:rgba(255,255,255,.05);transform:translateY(-2px)}
    .share-btn.insta{background:linear-gradient(135deg,#E1306C,#833AB4);border:none;color:#fff;font-weight:700;flex:1.4}
    .share-btn.tiktok{background:#000;border:1px solid rgba(255,255,255,.15);color:#fff}
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,255,135,.15);border:1px solid var(--green);color:var(--green);padding:10px 20px;border-radius:100px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;z-index:200;animation:fadeInOut 2.5s ease forwards;white-space:nowrap}
    @keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(10px)}15%,75%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,8,8,.96);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,.05);padding:10px 0 22px;display:flex;justify-content:space-around;z-index:50}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;opacity:.35;transition:opacity .2s}
    .nav-item.active{opacity:1}
    .nav-icon{font-size:22px}
    .nav-label{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:1.5px;color:rgba(245,240,232,.6);text-transform:uppercase}
    .nav-item.active .nav-label{color:var(--yellow)}
    .stats-row{display:flex;gap:20px;margin-top:14px;align-items:center}
    .stat-item{display:flex;flex-direction:column;align-items:center;gap:2px}
    .stat-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--yellow);line-height:1}
    .stat-label{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:1px;color:rgba(245,240,232,.3);text-transform:uppercase}
    .stat-sep{width:1px;height:28px;background:rgba(255,255,255,.08)}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const OCCASIONS = {
  fr: ["📚 Lycée","🎉 Soirée","🛒 Casual","💼 Entretien","🎭 Événement","🏃 Sport"],
  en: ["📚 School","🎉 Party","🛒 Casual","💼 Interview","🎭 Event","🏃 Sport"]
};

const STYLES_VIBE = [
  {icon:"🖤",name:"Streetwear"},{icon:"💅",name:"Clean Girl"},{icon:"🌸",name:"Soft / Y2K"},
  {icon:"🏀",name:"Sport Luxe"},{icon:"🎨",name:"Artsy"},{icon:"🌍",name:"Afro Vibes"}
];

const buildPrompt = (occasion, styleVibe, lang) => `You are DRIP CHECK — the world's most culturally sharp AI style judge. You speak Gen Z fluently.

OCCASION: ${occasion}
STYLE VIBE: ${styleVibe || "Not specified"}
LANGUAGE: ${lang === "fr" ? "French Gen Z slang (ouf, chelou, lourd, tu gères, c'est chaud, etc.)" : "English Gen Z slang (slay, no cap, it's giving, understood the assignment, fire, mid, bussin, etc.)"}

CULTURAL REFERENCES to draw from: Beyoncé, Rihanna, Burna Boy, Davido, Wizkid, Aya Nakamura, Damso, Tiakola, Nicki Minaj, Tyler the Creator, A$AP Rocky, Pharrell, Bad Bunny, Zendaya, Bella Hadid, Virgil Abloh, Euphoria characters, Y2K aesthetic, streetwear culture, meme references.

RULES: NEVER comment on body/face/weight. Only clothing choices. Honest but never cruel. Roast with love.

Respond ONLY in valid JSON (no backticks):
{"score":<1-10>,"scoreClass":<"score-fire" if>=9,"score-good" if>=7,"score-mid" if>=5,"score-low" otherwise>,"emoji":<single emoji>,"vibeTag":<3-6 punchy words>,"verdict":<2-3 punchy sentences, use <strong> for emphasis>,"comparisonIcon":<emoji>,"comparisonName":<celeb/character/object>,"comparisonText":<1-2 funny sentences>,"refs":<array of 2-3 cultural tags>,"challenge":<one concrete tip>}`;

export default function DripCheck() {
  const [image, setImage] = useState(null);
  const [occasion, setOccasion] = useState(null);
  const [styleVibe, setStyleVibe] = useState(null);
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [lang, setLang] = useState("fr");
  const [toast, setToast] = useState(null);
  const [activeNav, setActiveNav] = useState("check");
  const [stats, setStats] = useState({checks:0,shares:0,best:0});
  const [loadMsg, setLoadMsg] = useState("...");
  const fileRef = useRef();

  const MSGS = {
    fr:["ANALYSE EN COURS...","SCAN DE LA TENUE...","JUGEMENT IMMINENT...","VERDICT QUI ARRIVE..."],
    en:["ANALYSING FIT...","SCANNING THE DRIP...","JUDGMENT INCOMING...","AI IS COOKING..."]
  };

  const handleFile = (file) => {
    if (!file || !file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = (e) => { setImage(e.target.result); setResult(null); };
    reader.readAsDataURL(file);
  };

  const analyze = async () => {
    if (!image || !occasion) return;
    setLoading(true); setResult(null);
    let i = 0;
    const msgs = MSGS[lang];
    const iv = setInterval(() => { setLoadMsg(msgs[i % msgs.length]); i++; }, 650);
    try {
      const mediaType = image.startsWith("data:image/png") ? "image/png" : "image/jpeg";
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:1000,
          messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:mediaType,data:image.split(",")[1]}},
            {type:"text",text:buildPrompt(occasion,styleVibe,lang)}
          ]}]
        })
      });
      const data = await res.json();
      clearInterval(iv);
      const raw = data.content?.find(b=>b.type==="text")?.text||"";
      const parsed = JSON.parse(raw.replace(/```json|```/g,"").trim());
      setResult(parsed);
      setStats(s=>({checks:s.checks+1,shares:s.shares,best:Math.max(s.best,parsed.score)}));
    } catch(err) {
      clearInterval(iv);
      setResult({
        score:7,scoreClass:"score-good",emoji:"🔥",
        vibeTag:lang==="fr"?"Solide. T'as géré.":"Solid. You got it.",
        verdict:lang==="fr"?"Ta tenue envoie du <strong>lourd</strong>. L'IA a eu un petit bug mais ton style, lui, bug pas.":"Your fit is <strong>actually fire</strong>. The AI glitched but your drip didn't.",
        comparisonIcon:"✨",comparisonName:lang==="fr"?"Une version beta de toi-même":"A beta version of yourself",
        comparisonText:lang==="fr"?"En pleine mise à jour. Le glow-up arrive.":"Still loading. The glow-up is coming.",
        refs:["main character","understood the assignment","Y2K energy"],
        challenge:lang==="fr"?"Ajoute une pièce statement — veste, bag ou bijou. Juste une.":"Add one statement piece — jacket, bag, or jewelry. Just one."
      });
      setStats(s=>({...s,checks:s.checks+1}));
    }
    setLoading(false);
  };

  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(null),2600); };

  const handleShare = (platform) => {
    setStats(s=>({...s,shares:s.shares+1}));
    showToast(lang==="fr"?`✅ Lien copié ! Partage sur ${platform}`:`✅ Link copied! Share on ${platform}`);
  };

  const reset = () => { setImage(null); setResult(null); setOccasion(null); setStyleVibe(null); };

  const T = lang==="fr" ? {
    tagline:"L'IA qui juge ta tenue — no cap",
    uploadTitle:"BALANCE TA TENUE",uploadSub:"Photo ou selfie — L'IA te dit tout\n(elle ment jamais)",
    uploadBtn:"CHOISIR UNE PHOTO",changeBtn:"Changer",
    occasionLabel:"C'est pour quelle occasion ?",styleLabel:"Ton vibe habituel ?",
    analyzeBtn:"⚡ DRIP CHECK →",addPhoto:"📸 AJOUTE UNE PHOTO",chooseOcc:"👆 CHOISIS L'OCCASION",
    scoreLabel:"DRIP SCORE",checksLabel:"CHECKS",sharesLabel:"PARTAGES",bestLabel:"BEST SCORE"
  } : {
    tagline:"The AI that rates your fit — no cap",
    uploadTitle:"DROP YOUR FIT",uploadSub:"Photo or selfie — AI tells you everything\n(it never lies)",
    uploadBtn:"CHOOSE A PHOTO",changeBtn:"Change",
    occasionLabel:"What's the occasion?",styleLabel:"Your usual vibe?",
    analyzeBtn:"⚡ DRIP CHECK →",addPhoto:"📸 ADD A PHOTO",chooseOcc:"👆 PICK THE OCCASION",
    scoreLabel:"DRIP SCORE",checksLabel:"CHECKS",sharesLabel:"SHARES",bestLabel:"BEST SCORE"
  };

  return (
    <div className="app">
      <div className="header">
        <div className="logo-wrap">
          <div className="logo">DRIP CHECK</div>
          <span className="logo-beta">BETA</span>
        </div>
        <div className="tagline">{T.tagline}</div>
        {stats.checks > 0 && (
          <div className="stats-row">
            <div className="stat-item"><div className="stat-val">{stats.checks}</div><div className="stat-label">{T.checksLabel}</div></div>
            <div className="stat-sep"/>
            <div className="stat-item"><div className="stat-val">{stats.shares}</div><div className="stat-label">{T.sharesLabel}</div></div>
            <div className="stat-sep"/>
            <div className="stat-item"><div className="stat-val">{stats.best}/10</div><div className="stat-label">{T.bestLabel}</div></div>
          </div>
        )}
        <div className="lang-row">
          {["fr","en"].map(l=>(
            <button key={l} className={`lang-btn${lang===l?" active":""}`} onClick={()=>setLang(l)}>
              {l==="fr"?"🇫🇷 FR":"🇬🇧 EN"}
            </button>
          ))}
        </div>
      </div>

      {!image ? (
        <div className="upload-zone" onClick={()=>fileRef.current.click()}>
          <div className="upload-icon">📸</div>
          <div className="upload-title">{T.uploadTitle}</div>
          <div className="upload-sub" style={{whiteSpace:"pre-line"}}>{T.uploadSub}</div>
          <button className="upload-btn" onClick={e=>{e.stopPropagation();fileRef.current.click();}}>{T.uploadBtn}</button>
          <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
        </div>
      ) : (
        <div className="preview-wrap">
          <img src={image} alt="outfit" className="preview-img"/>
          <button className="preview-change" onClick={reset}>{T.changeBtn}</button>
        </div>
      )}

      <div className="section">
        <div className="section-label">{T.occasionLabel}</div>
        <div className="pills">
          {OCCASIONS[lang].map(o=>(
            <button key={o} className={`pill${occasion===o?" active":""}`} onClick={()=>setOccasion(o)}>{o}</button>
          ))}
        </div>
      </div>

      <div className="section">
        <div className="section-label">{T.styleLabel}</div>
        <div className="style-grid">
          {STYLES_VIBE.map(s=>(
            <div key={s.name} className={`style-card${styleVibe===s.name?" active":""}`} onClick={()=>setStyleVibe(s.name)}>
              <span className="style-icon">{s.icon}</span>
              <span className="style-name">{s.name}</span>
            </div>
          ))}
        </div>
      </div>

      {!result && !loading && (
        <button className="analyze-btn" disabled={!image||!occasion} onClick={analyze}>
          {!image?T.addPhoto:!occasion?T.chooseOcc:T.analyzeBtn}
        </button>
      )}

      {loading && (
        <div className="loading-wrap">
          <div className="loading-emoji">⚡</div>
          <div className="loading-text">{loadMsg}</div>
          <div className="loading-bar"><div className="loading-progress"/></div>
        </div>
      )}

      {result && (
        <>
          <div className="result-card">
            <div className="result-top">
              <div>
                <div className="score-label">{T.scoreLabel}</div>
                <div className={`score-num ${result.scoreClass}`}>{result.score}</div>
              </div>
              <div className="vibe-side">
                <div className="vibe-emoji">{result.emoji}</div>
                <div className="vibe-tag">{result.vibeTag}</div>
              </div>
            </div>
            <div className="divider"/>
            <div className="verdict" dangerouslySetInnerHTML={{__html:result.verdict}}/>
            {result.refs?.length>0 && (
              <div className="refs-row" style={{marginTop:12}}>
                {result.refs.map((r,i)=><span key={i} className="ref-tag">#{r}</span>)}
              </div>
            )}
            <div className="comparison">
              <div className="comp-icon">{result.comparisonIcon}</div>
              <div>
                <span className="comp-name">{result.comparisonName}</span>
                <span className="comp-text">{result.comparisonText}</span>
              </div>
            </div>
            <div className="challenge">
              <span className="challenge-icon">🎯</span>
              <span>{result.challenge}</span>
            </div>
          </div>
          <div className="share-row">
            <button className="share-btn" onClick={reset}>🔄 Retry</button>
            <button className="share-btn tiktok" onClick={()=>handleShare("TikTok")}>♪ TikTok</button>
            <button className="share-btn insta" onClick={()=>handleShare("Instagram")}>📸 Story</button>
          </div>
        </>
      )}

      {toast && <div className="toast">{toast}</div>}

      <div className="bottom-nav">
        {[
          {id:"check",icon:"⚡",label:"CHECK"},
          {id:"wardrobe",icon:"👗",label:lang==="fr"?"GARDE-ROBE":"WARDROBE"},
          {id:"feed",icon:"🔥",label:"FEED"},
          {id:"profile",icon:"👤",label:lang==="fr"?"MOI":"ME"}
        ].map(n=>(
          <div key={n.id} className={`nav-item${activeNav===n.id?" active":""}`} onClick={()=>setActiveNav(n.id)}>
            <div className="nav-icon">{n.icon}</div>
            <div className="nav-label">{n.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DripCheck/>);
</script>
</body>
</html>
